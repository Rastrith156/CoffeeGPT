[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore deprecation warnings from third-party packages (sentence-transformers, langchain)
filterwarnings =
    ignore::DeprecationWarning:langchain
    ignore::DeprecationWarning:transformers
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
