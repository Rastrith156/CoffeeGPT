name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: ruff check . --output-format=github

  # ── Backend: Type check ───────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt mypy types-redis types-requests

      - name: Run mypy
        run: mypy . --ignore-missing-imports --exclude venv --exclude alembic

  # ── Backend: Tests with coverage ──────────────────────────────────────────
  test:
    name: Tests (pytest + coverage ≥ 70%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          PYTHONPATH: .
          ENVIRONMENT: development
          AUTH_ENABLED: "false"
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          LLM_PROVIDER: lmstudio
          LMSTUDIO_BASE_URL: "http://localhost:1234"
          SECRET_KEY: ci-test-secret-key-32chars-long!
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars!
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v \
            --tb=short \
            --asyncio-mode=auto

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ── Frontend: Build ───────────────────────────────────────────────────────
  frontend-build:
    name: Frontend build (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Docker: Smoke test ────────────────────────────────────────────────────
  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t coffeegpt-backend:ci \
            backend/

      - name: Verify image starts
        run: |
          docker run --rm \
            -e ENVIRONMENT=development \
            -e AUTH_ENABLED=false \
            -e SECRET_KEY=ci-test-secret \
            -e JWT_SECRET_KEY=ci-test-jwt-secret \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e LMSTUDIO_BASE_URL=http://localhost:1234 \
            --entrypoint python \
            coffeegpt-backend:ci \
            -c "from core.config import settings; assert settings.app_name"
